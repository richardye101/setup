modelRoles:
  slow: anthropic/claude-opus-5-5
  smol: aios-agent-claude/claude-haiku-5-5
  plan: anthropic/claude-opus-5-5
  default: cursor/gpt-5.6-sol:high
composer:
  shape: band
theme:
  dark: titanium-prompts
update:
  auto: true
setupVersion: 3
defaultThinkingLevel: auto
memory:
  backend: sharpshooter
autolearn:
  enabled: true
sharpshooter:
  model: GPT 5.6 Sol
hideThinkingBlock: false
expandThinkingBlocks: false
proseOnlyThinking: true
display:
  hideToolActivity: false
  shellVisualization: false
  collapseCompacted: false
tui:
  mouse: false
  autoGraph: "off"
  completeScrollback: true
extensionRenderers:
  transcriptPresenters: true
dev:
  autoqaConsent: denied
  autoqa: false
telemetry:
  otlpExportEnabled: false
skills:
  customDirectories:
    - ~/.omp/design-skills
disabledProviders: []
compaction:
  methodOrder:
    - handoff
    - remote
    - soft
    - shake
    - snapcompact
  idleEnabled: true
  idleTimeoutSeconds: 3000
  idleThresholdTokens: 100000